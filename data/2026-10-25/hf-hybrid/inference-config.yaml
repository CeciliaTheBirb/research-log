model:
  target: navworld_inference.models.cosmos3_anyflow_causal_world_wrapper.Cosmos3AnyFlowCausalWorldModel
  params:
    cosmos_root: ./Cosmos3-Edge
    action_domain: av
    view_point: ego_view
    fps: 20.0
    max_text_tokens: 2048
    caption_format: sft
    meta_device_init: true
    lora:
      enabled: true
      r: 128
      alpha: 128
      dropout: 0.0
      target_modules:
      - add_q_proj
      - add_k_proj
      - add_v_proj
      - to_add_out
      - mlp_moe_gen.gate_proj
      - mlp_moe_gen.up_proj
      - mlp_moe_gen.down_proj
      - time_embedder.linear_1
      - time_embedder.linear_2
      - target_time_embedder.linear_1
      - target_time_embedder.linear_2
    source_time_weight: 0.75
    target_time_weight: 0.25
    num_frame_per_block: [1, 3]
    causal_attention_backend: flex
    history_memory:
      rope: spatial
      fold: vision_action
    sequence_parallel_size: 1
train:
  trainable_params:
  - lora_
  - action_proj_in
  - action_proj_out
  - action_modality_embed
  - time_embedder
  - target_time_embedder
  - history_proj
# Defaults of the windowed evaluation; command-line flags override them.
generation:
  attention_sink_size: 1
  attention_history_cutoff: 2
  inference_step_schedule: [4, 3, 2, 2, 2, 2, 2, 2, 2, 2]
